name: CI Pipeline

on:
push:
branches: [ main ]
pull_request:
branches: [ main ]

jobs:
build:
runs-on: ubuntu-latest

steps:
  # Checkout repository
  - name: Checkout code
    uses: actions/checkout@v3

  # Set up Node.js
  - name: Set up Node.js
    uses: actions/setup-node@v3
    with:
      node-version: '18'

  # Install dependencies
  - name: Install dependencies
    run: npm install

  # Lint with ESLint
  - name: Run ESLint
    run: npx eslint .

  # Run unit tests with Jest
  - name: Run Jest tests
    run: npm test
